<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Letter for Sanyukta</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        /* 
         * 👑 ROYAL NOVELISTIC THEME 👑
         * Optimized for Mobile and GPU Performance
         */
        :root {
            --royal-gold: #d4af37;
            --gold-light: #fbeea1;
            --parchment: #f4ecd8;
            --dark-ink: #2b1b04;
            --velvet-dark: #120a0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* Prevent text selection on mobile for app-like feel */
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Lora', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Using dvh (dynamic viewport height) fixes mobile browser jumping */
            height: 100dvh; 
            overflow: hidden;
            background-color: var(--velvet-dark);
            
            /* Background optimized for devices */
            background-image: url('The Knight Who Knelt Only for His Queen ⚔️👑.jpg'); 
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* Dark overlay for contrast */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(18,10,11,0.4), rgba(18,10,11,0.8));
            z-index: 0;
            pointer-events: none;
        }

        /* 
         * GPU-ACCELERATED PETALS & SPARKLES
         */
        #flower-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            pointer-events: none; 
            z-index: 5;
            opacity: 0; 
            transition: opacity 2s ease-in-out;
            will-change: opacity;
        }

        .flower {
            position: absolute;
            top: -10%;
            /* Using hardware acceleration */
            will-change: transform, opacity;
            animation: fall linear forwards;
            filter: drop-shadow(0 0 5px rgba(212,175,55,0.4));
        }

        /* translate3d forces GPU rendering for buttery smooth drops */
        @keyframes fall {
            0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 0.8; }
            100% { transform: translate3d(50px, 110vh, 0) rotate(360deg); opacity: 0; }
        }

        /* 
         * WELCOME SCREEN
         */
        #welcome-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background: radial-gradient(circle, rgba(26,15,18,0.9) 0%, rgba(10,5,6,1) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1.5s ease-in-out;
            will-change: opacity;
        }

        .novel-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-style: italic;
            font-weight: 600;
            margin-bottom: 40px;
            color: var(--royal-gold);
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(212,175,55,0.3);
            text-align: center;
            padding: 0 20px;
        }

        #start-btn {
            padding: 14px 35px;
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--velvet-dark);
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--royal-gold) 100%);
            border: none;
            border-radius: 2px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212,175,55,0.2), inset 0 0 5px rgba(255,255,255,0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            will-change: transform;
        }

        #start-btn:active {
            transform: scale(0.96);
        }

        /* 
         * THE 3D ROYAL CARD
         */
        .scene {
            width: 340px;
            height: 480px;
            perspective: 1200px;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            cursor: pointer;
            z-index: 10;
            will-change: opacity;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            transform-style: preserve-3d;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            will-change: transform;
        }

        .card.is-flipped {
            transform: rotateY(-180deg);
            cursor: default;
        }

        /* Card Faces */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            /* Hides the back side of the element cleanly on mobile */
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: var(--parchment);
            border: 2px solid var(--royal-gold);
            outline: 1px solid var(--royal-gold);
            outline-offset: -6px;
            background-image: 
                radial-gradient(circle at center, transparent 0%, rgba(139, 115, 85, 0.08) 100%),
                linear-gradient(135deg, rgba(255,255,255,0.4) 0%, transparent 100%);
        }

        .card-front {
            border-radius: 2px 8px 8px 2px;
        }

        .card-front::before, .card-front::after {
            content: '✧';
            position: absolute;
            color: var(--royal-gold);
            font-size: 24px;
        }
        .card-front::before { top: 10px; left: 10px; }
        .card-front::after { bottom: 10px; right: 10px; }

        .to-name {
            font-family: 'Playfair Display', serif;
            font-size: 38px;
            font-weight: 700;
            color: var(--dark-ink);
            text-shadow: 0 1px 1px rgba(255,255,255,0.8);
            z-index: 2;
        }

        .instruction {
            position: absolute;
            bottom: 40px;
            font-size: 14px;
            font-style: italic;
            color: #7a6345;
            z-index: 2;
            animation: pulse 2.5s infinite;
        }

        .card-back {
            transform: rotateY(180deg);
            padding: 30px 20px;
            justify-content: flex-start;
            border-radius: 8px 2px 2px 8px;
            overflow-y: auto; /* Allows scrolling if text is too long on small phones */
            scrollbar-width: none; /* Hides scrollbar on Firefox */
        }
        
        .card-back::-webkit-scrollbar {
            display: none; /* Hides scrollbar on Chrome/Safari */
        }

        .confession-text {
            font-family: 'Lora', serif;
            font-size: 15px; /* Slightly smaller for better mobile fit */
            line-height: 1.7;
            color: var(--dark-ink);
            text-align: left;
            width: 100%;
            font-weight: 500;
        }

        .confession-text .line:first-child::first-letter {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: var(--royal-gold);
            float: left;
            line-height: 0.8;
            margin-right: 5px;
            margin-top: 5px;
        }

        .line {
            opacity: 0;
            transform: translate3d(0, 8px, 0);
            transition: opacity 1s ease-out, transform 1s ease-out;
            margin-bottom: 12px;
            display: block;
            text-shadow: 0 0 1px rgba(212,175,55,0.2); 
            will-change: transform, opacity;
        }

        .line.visible {
            opacity: 1;
            transform: translate3d(0, 0, 0);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* RESPONSIVE DESIGN FOR SMALLER PHONES */
        @media screen and (max-width: 380px) {
            .scene {
                width: 90vw;
                height: 75vh;
            }
            .novel-title {
                font-size: 24px;
            }
            .to-name {
                font-size: 32px;
            }
            .confession-text {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- Audio Files -->
    <audio id="bg-music" src="every-moment-roman-main-version-49472-01-31.mp3" loop preload="auto"></audio>
    <audio id="voice-note" src="voice.mp3" preload="auto"></audio>

    <div id="flower-container"></div>

    <div id="welcome-screen">
        <div class="novel-title">A Tale Waiting to be Read</div>
        <button id="start-btn">Break the Seal</button>
    </div>

    <div class="scene" id="card-scene">
        <div class="card" id="the-card">
            
            <div class="card-face card-front">
                <div class="to-name">For Sanyukta</div>
                <div class="instruction">Tap to open</div>
            </div>

            <div class="card-face card-back">
                <div class="confession-text" id="lyrics-container"></div>
            </div>

        </div>
    </div>

    <script>
        const welcomeScreen = document.getElementById('welcome-screen');
        const startBtn = document.getElementById('start-btn');
        const cardScene = document.getElementById('card-scene');
        const theCard = document.getElementById('the-card');
        const lyricsContainer = document.getElementById('lyrics-container');
        const flowerContainer = document.getElementById('flower-container');
        
        const bgMusic = document.getElementById('bg-music');
        const voiceNote = document.getElementById('voice-note');

        let hasFlipped = false;
        let activeLineIndex = -1;
        
        // Cache DOM elements here for extreme JS optimization
        const cachedLineElements = [];

        // The Timing Script
        const scriptLines = [
            { time: 0.5, text: "Sanyukta... I know my voice on recordings isn't exactly audiobook material," },
            { time: 5.0, text: "but texting this just felt wrong. I needed you to hear it." },
            { time: 9.5, text: "Our first meeting was unforgettable, but that second time we met... that just felt like destiny." },
            { time: 16.0, text: "I know I’m far from perfect, and I know I might not be your first chapter." },
            { time: 21.0, text: "But this sacred connection we have is something I want to protect with everything I have." },
            { time: 27.0, text: "I’ve built this quiet little castle right here on the left side of my chest, and I just want to fill it with your happiness." },
            { time: 35.0, text: "I know you aren't big on the traditional 'girlfriend' label, so I won't use it." },
            { time: 41.0, text: "Instead, since today is Girlfriend’s Day, I just wanted to leave this here for you to ask..." },
            { time: 48.0, text: "will you be my one and only princess?" },
            { time: 51.0, text: "The only ladylove to claim my heart?" }
        ];

        // Create elements ONCE and store them in memory
        scriptLines.forEach((line) => {
            const span = document.createElement('span');
            span.className = 'line';
            span.innerText = line.text;
            lyricsContainer.appendChild(span);
            cachedLineElements.push(span); // Caching for performance
        });

        // Optimized Flower Engine
        function startFlowerShower() {
            flowerContainer.style.opacity = '1';
            const elements = ['🌹', '✨', '🥀', '✧']; 

            setInterval(() => {
                const flower = document.createElement('div');
                flower.className = 'flower';
                flower.innerText = elements[Math.floor(Math.random() * elements.length)];
                
                // Keep styles minimal in JS, let CSS handle the heavy lifting
                flower.style.left = Math.random() * 100 + 'vw';
                flower.style.animationDuration = (Math.random() * 5 + 7) + 's'; 
                flower.style.fontSize = (Math.random() * 12 + 14) + 'px';
                
                flowerContainer.appendChild(flower);
                
                setTimeout(() => {
                    flower.remove();
                }, 12000);
            }, 300); 
        }

        // 1. Unlocking the experience
        startBtn.addEventListener('click', () => {
            bgMusic.volume = 1.0;
            bgMusic.play().catch(e => console.log(e));

            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                cardScene.style.opacity = '1';
            }, 1500);
        });

        // 2. Flipping the card & starting the magic
        theCard.addEventListener('click', () => {
            if (hasFlipped) return; 
            hasFlipped = true;

            theCard.classList.add('is-flipped');
            startFlowerShower();

            let fadeInterval = setInterval(() => {
                if (bgMusic.volume > 0.15) {
                    bgMusic.volume = Math.max(0, bgMusic.volume - 0.05);
                } else {
                    clearInterval(fadeInterval);
                    voiceNote.play();
                }
            }, 200);
        });

        // 3. Ultra-Optimized Sync Engine
        voiceNote.addEventListener('timeupdate', () => {
            if (activeLineIndex + 1 < scriptLines.length) {
                if (voiceNote.currentTime >= scriptLines[activeLineIndex + 1].time) {
                    activeLineIndex++;
                    // Directly access the cached element instead of searching the DOM
                    cachedLineElements[activeLineIndex].classList.add('visible');
                }
            }
        });
    </script>
</body>
</html>
